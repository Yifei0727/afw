name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cross: false
          - target: aarch64-unknown-linux-musl
            cross: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (aarch64 needs a musl cross-linker)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (musl static)
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
          file target/${{ matrix.target }}/release/afw

      - name: Smoke test (x86_64 only, runners are x86_64)
        if: matrix.cross == false
        run: |
          target/x86_64-unknown-linux-musl/release/afw -h > /dev/null
          target/x86_64-unknown-linux-musl/release/afw -n nonexistent-proc --dry-run --once

      - uses: actions/upload-artifact@v4
        with:
          name: afw-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/afw
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: afw-x86_64-unknown-linux-musl
          path: out/x86_64
      - uses: actions/download-artifact@v4
        with:
          name: afw-aarch64-unknown-linux-musl
          path: out/aarch64

      - name: Rename binaries
        run: |
          cp out/x86_64/afw afw-x86_64-linux-musl
          cp out/aarch64/afw afw-aarch64-linux-musl
          sha256sum afw-*-linux-musl > sha256sums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            afw-x86_64-linux-musl
            afw-aarch64-linux-musl
            sha256sums.txt
          generate_release_notes: true
